<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chinese Restaurant Menu">
  <title>Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">MENU</div>
      <div class="language-switcher" aria-label="Language switcher">
        <button class="lang-btn active" data-lang="ch">中文</button>
        <button class="lang-btn" data-lang="jp">日本語</button>
        <button class="lang-btn" data-lang="en">English</button>
      </div>
    </div>

    <nav class="category-nav" aria-label="Categories">
      <div id="categoryList" class="category-list"></div>
    </nav>
  </header>

  <main class="menu-container">
    <div class="menu-heading">
      <p class="eyebrow">RESTAURANT MENU</p>
      <h1 id="menuTitle">全部</h1>
      <div class="heading-line"></div>
    </div>
    <section id="menuList" class="menu-list" aria-live="polite"></section>
    <p id="emptyMessage" class="empty-message" hidden>No dishes found.</p>
  </main>

  <footer class="site-footer">GOOD FOOD, GOOD MOMENTS.</footer>

  <script src="script.js"></script>
</body>
</html>
